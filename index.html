<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image to PDF Converter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-purple-100 to-blue-100 dark:from-gray-900 dark:to-gray-800 transition-all duration-300">

  <div class="flex justify-between items-center p-4">
    <h1 class="text-2xl font-bold text-gray-800 dark:text-white">🖼️ Image to PDF Converter</h1>
    <label class="flex items-center space-x-2 cursor-pointer">
      <input type="checkbox" id="theme-toggle" class="hidden">
      <span class="text-gray-700 dark:text-white">Dark Mode</span>
      <div class="w-10 h-5 bg-gray-300 dark:bg-gray-600 rounded-full relative">
        <div class="toggle-dot w-5 h-5 bg-white rounded-full shadow absolute left-0 transition-all duration-300" id="toggle-dot"></div>
      </div>
    </label>
  </div>

  <div class="flex flex-col items-center justify-center min-h-[20vh] p-4">
    <div id="drop-area" class="border-4 border-dashed border-gray-500 dark:border-gray-300 p-6 rounded-lg bg-white dark:bg-gray-700 shadow-md text-center w-full max-w-lg transition-all">
      <p class="text-lg font-medium text-gray-700 dark:text-white mb-2">Drag & Drop your images here</p>
      <input type="file" id="fileElem" multiple accept="image/*" class="hidden">
      <button onclick="document.getElementById('fileElem').click()" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-lg transition">
        Select Images
      </button>
    </div>

    <div id="preview" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 mt-6 w-full max-w-4xl"></div>

    <button onclick="generatePDF()" class="mt-6 px-6 py-3 bg-green-600 hover:bg-green-700 text-white font-bold text-lg rounded-lg flex items-center gap-2 transition">
      📄 Convert to PDF
    </button>

    <div id="loader" class="mt-4 hidden">
      <div class="w-8 h-8 border-4 border-blue-500 border-dashed rounded-full animate-spin"></div>
      <p class="text-blue-700 mt-2">Generating PDF...</p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
  <script>
    const dropArea = document.getElementById("drop-area");
    const fileInput = document.getElementById("fileElem");
    const preview = document.getElementById("preview");
    const loader = document.getElementById("loader");
    let images = [];

    // Theme toggle
    const themeToggle = document.getElementById("theme-toggle");
    const toggleDot = document.getElementById("toggle-dot");
    themeToggle.addEventListener("change", () => {
      document.documentElement.classList.toggle("dark");
      toggleDot.style.left = themeToggle.checked ? "calc(100% - 1.25rem)" : "0";
    });

    dropArea.addEventListener("dragover", e => {
      e.preventDefault();
      dropArea.classList.add("bg-purple-200", "dark:bg-gray-600");
    });

    dropArea.addEventListener("dragleave", () => {
      dropArea.classList.remove("bg-purple-200", "dark:bg-gray-600");
    });

    dropArea.addEventListener("drop", e => {
      e.preventDefault();
      dropArea.classList.remove("bg-purple-200", "dark:bg-gray-600");
      handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener("change", () => {
      handleFiles(fileInput.files);
    });

    function handleFiles(files) {
      for (const file of files) {
        if (!file.type.startsWith("image/")) continue;
        const reader = new FileReader();
        reader.onload = e => {
          const image = { name: file.name, size: file.size, data: e.target.result };
          images.push(image);
          renderPreviews();
        };
        reader.readAsDataURL(file);
      }
    }

    function renderPreviews() {
      preview.innerHTML = "";
      images.forEach((img, i) => {
        const card = document.createElement("div");
        card.className = "relative bg-white dark:bg-gray-600 rounded-lg shadow p-2";

        const imageEl = document.createElement("img");
        imageEl.src = img.data;
        imageEl.className = "rounded-md w-full h-32 object-cover mb-1";

        const fileInfo = document.createElement("div");
        fileInfo.className = "text-sm text-center text-gray-700 dark:text-white";
        fileInfo.innerHTML = `${img.name}<br>${(img.size / 1024).toFixed(1)} KB`;

        const delBtn = document.createElement("button");
        delBtn.innerHTML = "❌";
        delBtn.className = "absolute top-1 right-1 text-sm bg-red-600 text-white rounded-full px-2 py-1";
        delBtn.onclick = () => {
          images.splice(i, 1);
          renderPreviews();
        };

        card.appendChild(delBtn);
        card.appendChild(imageEl);
        card.appendChild(fileInfo);
        preview.appendChild(card);
      });
    }

    async function generatePDF() {
      if (images.length === 0) return alert("Please upload at least one image.");
      loader.classList.remove("hidden");

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF();

      for (let i = 0; i < images.length; i++) {
        const img = new Image();
        img.src = images[i].data;

        await new Promise(resolve => {
          img.onload = () => {
            const width = pdf.internal.pageSize.getWidth();
            const height = (img.height * width) / img.width;
            if (i > 0) pdf.addPage();
            pdf.addImage(img, 'JPEG', 0, 0, width, height);
            resolve();
          };
        });
      }

      loader.classList.add("hidden");
      pdf.save("converted.pdf");
    }
  </script>
</body>
</html>
